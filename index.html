<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컴퓨터는 어떻게 일할까? · 컴퓨팅 시스템 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== 디자인 토큰 (부품 짝꿍 찾기와 같은 디자인) ===== */
:root{--ground:#EDF1EF;--ink:#16211C;--sub:#3B4A44;--muted:#4A5A53;--line:#A7B3AD;--soft:#E1E6E3;--card:#FFFFFF;--ok:#1B7F4B;--okbg:#E3F3EA;--bad:#B42318;--badbg:#FDE7E4;--focus:#1E5A9C;--warm:#FBEADB;--warmink:#5E2A05}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.disp{font-family:'Do Hyeon',sans-serif;font-weight:400}
.wrap{max-width:1200px;margin:0 auto;padding:32px 20px 64px;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px}
.kick{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.02em}
h1{margin:6px 0;font-size:44px;line-height:1.15}
.lead{margin:0;font-size:16px;line-height:1.6;color:var(--sub)}
.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{min-width:84px;padding:10px 14px;border-radius:12px;background:#fff;display:flex;flex-direction:column;gap:2px}
.tile.dark{background:var(--ink);color:#fff}
.tile small{font-size:12px;font-weight:700}
.tile b{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:28px;line-height:1}.tile b span{font-size:15px;opacity:.75}
.panel{background:#fff;border-radius:16px;padding:18px}
.btn{min-height:52px;padding:10px 22px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;font-size:16px}
.btn.ghost{background:#fff;color:var(--ink)}
.btn:disabled{border-color:var(--line);background:var(--soft);color:var(--muted)}
.row-end{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:flex-end}
.row-end .grow{margin-right:auto;font-size:16px;font-weight:700}
.alert{color:var(--bad);font-weight:700;font-size:15px}
h2{margin:0;font-size:28px}
.rule{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--sub);background:#fff;border-radius:12px;padding:12px 16px}.rule b{color:var(--ink)}
input.t{width:100%;min-height:52px;padding:0 14px;border:2px solid var(--line);border-radius:12px;font-size:18px;color:var(--ink)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.vcard{min-height:120px;padding:16px;border-radius:16px;border:2px solid var(--ink);background:#fff;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:6px}
.vcard.on{background:var(--ink);color:#fff}
.vcard .n{font-family:'Do Hyeon',sans-serif;font-size:32px;line-height:1}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.step{min-height:52px;padding:8px 14px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;text-align:left}
.step .num{width:28px;height:28px;flex:none;border-radius:999px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.step .st{margin-left:auto;font-size:12px;font-weight:500;white-space:nowrap}
.step.on{background:var(--ink);color:#fff}.step.on .num{background:#fff;color:var(--ink)}
.navhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--sub)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:3px}
.navgroups{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:10px}
.ng{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.ng>span{font-size:13px;font-weight:700;color:var(--sub);margin-right:2px}
.qn{width:44px;height:44px;border-radius:10px;border:2px dashed var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:15px}
.qn.done{border:2px solid var(--ink);background:var(--ink);color:#fff}
.qn.ok{border:2px solid var(--ok);background:var(--ok);color:#fff}
.qn.bad{border:2px solid var(--bad);background:var(--bad);color:#fff}
.qn.cur{outline:3px solid var(--focus);outline-offset:2px}
.qcard{background:#fff;border:2px solid #D5DCD8;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qcard.ok{border-color:var(--ok)}.qcard.bad{border-color:var(--bad)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--ink);color:#fff}
.scene{background:var(--warm);color:var(--warmink);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.65}
.term{font-family:'Do Hyeon',sans-serif;font-size:34px;line-height:1.1}
.qlist{display:flex;flex-direction:column;gap:14px}.qlist.p1{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.opts.two{grid-template-columns:1fr}
.qq{margin:0;font-size:18px;font-weight:700;line-height:1.55}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.opt{min-height:56px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);font-size:17px;font-weight:500;line-height:1.45;display:flex;align-items:center;gap:12px;text-align:left}
.opt .d{width:30px;height:30px;flex:none;border-radius:999px;background:var(--ground);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.opt .m{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.opt.on{background:var(--ink);border-color:var(--ink);color:#fff}.opt.on .d{background:#fff;color:var(--ink)}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.right .d{background:var(--ok);color:#fff}.opt.right .m{color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}.opt.wrong .d{background:var(--bad);color:#fff}.opt.wrong .m{color:var(--bad)}
.opt.dim{border-color:#D5DCD8;color:var(--muted)}.opt.dim .d{background:var(--line);color:#fff}
.qcard.part{border-color:#C9772E}
.rubric{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--sub);background:#F6F8F7;border-radius:10px;padding:10px 14px}.rubric b{color:var(--ink)}
textarea.essay{width:100%;font-size:16px;line-height:1.6;padding:10px 12px;border-radius:12px;border:2px solid var(--line);resize:vertical;color:var(--ink)}
textarea.essay[readonly]{background:#F6F8F7}
.count{font-size:13px;color:var(--muted);align-self:flex-end}
label.qq{display:block}
.why{margin:0;font-size:15px;line-height:1.65;background:var(--ground);border-radius:10px;padding:12px 14px}
.qnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--soft)}
.qnav button{min-height:48px;padding:8px 18px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:700;font-size:15px}
.qnav button:disabled{border-color:#D5DCD8;color:var(--line)}
.pool{background:#fff;border:2px dashed #C3CCC7;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pool.hot{border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:48px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 16px 6px 6px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:700;font-size:16px;cursor:grab;touch-action:manipulation}
.chip .cn{width:28px;height:28px;border-radius:999px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.chip.sel{background:var(--ink);color:#fff}.chip.sel .cn{background:#fff;color:var(--ink)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.bin{border:2px solid;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:260px}
.bin.hot{border-style:dashed}
.bin .bl{font-family:'Do Hyeon',sans-serif;font-size:28px}.bin .bh{font-size:13px;color:var(--sub);line-height:1.5}
.item{min-height:44px;border-radius:10px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;text-align:left;cursor:grab}
.item .m{font-size:12px;line-height:1.3;text-align:right}
.item.sel{border-color:var(--focus);box-shadow:0 0 0 2px var(--focus) inset}
.place{min-height:44px;border-radius:10px;border:2px dashed;background:transparent;font-size:14px;font-weight:700}
.wline{margin:0;font-size:15px;line-height:1.6;background:#fff;border-radius:10px;padding:10px 14px}
.banner{background:var(--ink);color:#fff;border-radius:16px;padding:22px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.banner .big{font-family:'Do Hyeon',sans-serif;font-size:60px;line-height:1}.banner .big span{font-size:24px;opacity:.75}
.bar{height:12px;background:var(--soft);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;border-radius:999px}
.wbtn{min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--bad);background:var(--badbg);color:#7A1A10;font-size:14px;font-weight:700}
@media (max-width:520px){h1{font-size:34px}.term{font-size:38px}.banner .big{font-size:48px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// ▼ 선생님 점수 받는 웹 앱 주소 (구글 Apps Script 배포 후 아래 따옴표 안에 붙여넣기)
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwRjiMZ1EoxIdh20l2Mpk2hYR7DtBE6tvF3LBeY-kIAQUB6VUj0JyDgDSNtZXDzy_9b-A/exec';
const QUIZ_NAME = '컴퓨팅 시스템과 운영체제';

const DATA = {
  parts: ['하드웨어·소프트웨어', '장치 분류', '스마트폰 속 컴퓨터', '요리로 이해하기', '운영체제 자원 관리'],
  pts: [3, 3, 3, 3],
  shortPts: 3,
  p5: {
    A: {
      short: [
        { q: '여러 프로그램이 CPU를 번갈아 쓰도록 순서와 시간을 정해 주는 일은 운영체제가 어떤 자원을 관리하는 것일까요? (○○ 관리)', keys: ['CPU', '씨피유', '중앙처리장치', '프로세서', '처리장치'], ans: 'CPU(프로세서) 관리', w: 'CPU는 한 번에 한 가지 일만 할 수 있어서, 운영체제가 여러 프로그램의 차례와 사용 시간을 정해 줘요.' },
        { q: '실행 중인 프로그램에 기억 공간을 나눠 주고, 프로그램이 끝나면 그 공간을 돌려받는 일은 ○○○ 관리일까요?', keys: ['메모리', 'RAM', '램', '주기억', '기억장치'], ans: '메모리(주기억장치) 관리', w: '운영체제는 RAM을 프로그램마다 나눠 주고, 다 쓰면 거둬들여 다른 프로그램이 쓸 수 있게 해요.' },
        { q: '여러 사람이 프린터 한 대에 동시에 인쇄를 보내면, 운영체제가 줄을 세워 하나씩 보내 줘요. 이것은 어떤 장치를 관리하는 일일까요? (○○○ 장치 관리)', keys: ['입출력', '주변', '출력장치', '프린터'], ans: '입출력 장치 관리', w: '키보드·프린터처럼 연결된 장치를 알아보고, 여러 프로그램이 겹치지 않게 차례로 쓰도록 관리해요.' }
      ],
      essay: [
        { s: '햄버거 가게에 주방장(CPU)은 1명뿐인데 주문 3개가 한꺼번에 들어왔다.', q: '매니저(운영체제)가 어떻게 하면 손님 모두가 너무 오래 기다리지 않을지, 컴퓨터의 CPU 관리와 연결하여 서술하시오.',
          rubric: [ { d: '주문(작업)의 순서를 정한다', kw: ['순서', '차례', '줄', '대기', '먼저'], pts: 3 }, { d: '시간을 나눠 조금씩 번갈아 처리한다', kw: ['번갈아', '나눠', '나누어', '교대', '돌아가', '조금씩', '시간'], pts: 3 }, { d: 'CPU·운영체제라는 용어로 연결한다', kw: ['CPU', '씨피유', '중앙처리', '프로세서', '운영체제'], pts: 2 } ],
          model: '운영체제는 CPU를 쓰려는 프로그램들의 순서를 정하고, 짧은 시간씩 번갈아 CPU를 쓰게 한다. 매니저도 주문에 차례를 정하고 주방장이 조금씩 나눠 만들게 하면 모든 손님이 지나치게 오래 기다리지 않는다.' },
        { q: '컴퓨터에 프로그램을 너무 많이 켜 두면 느려지는 까닭을 ‘메모리 관리’와 연결하여 쓰고, 해결 방법을 한 가지 쓰시오.',
          rubric: [ { d: '메모리(RAM)를 언급한다', kw: ['메모리', 'RAM', '램', '주기억'], pts: 3 }, { d: '공간이 부족해진다고 설명한다', kw: ['부족', '가득', '모자', '꽉', '차서', '찼', '적어', '모자라'], pts: 2 }, { d: '해결 방법(안 쓰는 프로그램 끄기, RAM 늘리기 등)을 쓴다', kw: ['종료', '닫', '끄', '끈', '줄이', '늘리', '추가', '증설', '정리'], pts: 3 } ],
          model: '실행 중인 프로그램은 모두 RAM에 올라가는데, 프로그램이 많으면 RAM 공간이 부족해져 운영체제가 메모리를 나눠 주기 어려워지고 느려진다. 쓰지 않는 프로그램을 종료하거나 RAM을 늘리면 해결할 수 있다.' }
      ]
    },
    B: {
      short: [
        { q: '파일을 폴더로 정리하고, 저장 장치의 어느 곳에 저장할지 정해 주는 운영체제의 일은 ○○ 관리일까요?', keys: ['파일', '저장', '보조기억', '디스크'], ans: '파일(저장 장치) 관리', w: '운영체제는 SSD·하드디스크 같은 저장 장치에 파일을 어디에 둘지 정하고, 폴더로 정리해 쉽게 찾게 해 줘요.' },
        { q: '운영체제가 관리하는 자원 가운데, 명령을 해석하고 계산하는 장치는 무엇일까요?', keys: ['CPU', '씨피유', '중앙처리장치', '프로세서', '처리장치'], ans: 'CPU(중앙 처리 장치)', w: 'CPU는 계산과 판단을 맡는 가장 중요한 자원이라 운영체제가 사용 순서를 관리해요.' },
        { q: '키보드·마우스·프린터처럼 컴퓨터에 연결된 장치를 알아보고 쓸 수 있게 해 주는 운영체제의 일은 ○○○ 장치 관리일까요?', keys: ['입출력', '주변'], ans: '입출력 장치 관리', w: '운영체제는 연결된 장치를 알아보고(드라이버 이용), 프로그램이 장치를 쓸 수 있게 이어 줘요.' }
      ],
      essay: [
        { s: '분식집 사장님은 ‘라면 먼저, 떡볶이는 다음’처럼 순서를 정하고, 조리대와 냄비를 직원에게 나눠 준다.', q: '사장님의 역할을 운영체제의 자원 관리와 연결하여 두 가지 이상 서술하시오.',
          rubric: [ { d: '순서 정하기를 CPU(처리) 관리와 연결한다', kw: ['CPU', '씨피유', '프로세서', '처리장치', '중앙처리'], pts: 3 }, { d: '조리대·냄비 나눠 주기를 메모리나 장치 관리와 연결한다', kw: ['메모리', 'RAM', '램', '주기억', '장치', '입출력'], pts: 3 }, { d: '‘자원을 나눠 준다(배분한다)’는 뜻을 쓴다', kw: ['나눠', '나누', '배분', '할당', '분배', '자원'], pts: 2 } ],
          model: '사장님이 주문 순서를 정하는 것은 운영체제가 CPU를 쓰는 순서를 정하는 CPU 관리와 같다. 조리대와 냄비를 직원에게 나눠 주는 것은 운영체제가 메모리와 장치를 프로그램에 할당하는 메모리·장치 관리와 같다.' },

const qs = (v, p) => p === 0 ? v.p1.map((x) => ({ term: x.t, q: '하드웨어일까요, 소프트웨어일까요?', o: ['하드웨어', '소프트웨어'], a: x.a === 'H' ? 0 : 1, w: x.w || (x.a === 'H' ? DATA.hwWhy : DATA.swWhy) })) : p === 2 ? v.p3 : p === 3 ? v.p4 : null;
const size = (v, p) => [v.p1.length, v.p2.length, v.p3.length, v.p4.length, p5Of(v).short.length + p5Of(v).essay.length][p];
const ok = (v, p, i) => {
  if (p === 4) { const x = p5Of(v), ns = x.short.length; if (i < ns) return shortOk(x.short[i], S.ans[4][i]); const r = essayEval(x.essay[i - ns], S.ans[4][i]); return r.score === r.max; }
  return p === 1 ? S.ans[1][i] === v.p2[i].a : S.ans[p][i] === qs(v, p)[i].a;
};
const cnt = (p) => p === 4 ? Object.keys(S.ans[4]).filter((i) => filled5(ver(), +i, S.ans[4][i])).length : Object.keys(S.ans[p]).length;
const maxOf = (v, p) => p === 4 ? p5Of(v).short.length * DATA.shortPts + p5Of(v).essay.reduce((b, e) => b + essayEval(e, '').max, 0) : size(v, p) * DATA.pts[p];
const score = (v, p) => {
  if (p === 4) { const x = p5Of(v), ns = x.short.length; let t = 0; x.short.forEach((q, i) => { if (shortOk(q, S.ans[4][i])) t += DATA.shortPts; }); x.essay.forEach((e, j) => { t += essayEval(e, S.ans[4][ns + j]).score; }); return t; }
  let c = 0; for (let i = 0; i < size(v, p); i++) if (ok(v, p, i)) c++; return c * DATA.pts[p];
};
const cat = (id) => DATA.cats.find((c) => c.id === id);
function set(o, scroll) { Object.assign(S, o); render(); if (scroll) window.scrollTo(0, 0); }
function setAns(p, i, val) { if (val === null) delete S.ans[p][i]; else S.ans[p][i] = val; dragI = -1; set({ sel: -1 }); }

function vStart() {

  <div class="panel" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">
   <div><label for="sschool" style="font-size:15px;font-weight:700;display:block;margin-bottom:6px">학교</label><input class="t" id="sschool" autocomplete="off" placeholder="예: ○○중학교" value="${esc(S.school)}"></div>
   <div><label for="sid" style="font-size:15px;font-weight:700;display:block;margin-bottom:6px">학번</label><input class="t" id="sid" inputmode="numeric" autocomplete="off" placeholder="예: 10315" value="${esc(S.sid)}"></div>
   <div><label for="sname" style="font-size:15px;font-weight:700;display:block;margin-bottom:6px">이름</label><input class="t" id="sname" autocomplete="off" placeholder="예: 김다산" value="${esc(S.name)}"></div></div>
  <div class="navhead"><h2 class="disp" style="font-size:26px">풀 유형 고르기</h2><button class="btn ghost" data-act="random" style="min-height:44px;font-size:15px">무작위로 고르기</button></div>
  <div class="vgrid">${DATA.versions.map((x) => `<button class="vcard ${x.id === S.ver ? 'on' : ''}" data-act="ver" data-v="${x.id}" aria-pressed="${x.id === S.ver}"><span class="n">${x.name}</span><b style="font-size:17px">${x.theme}</b><span style="font-size:14px;line-height:1.5;opacity:.85">${x.desc}</span></button>`).join('')}</div>
  <div class="rule"><b>점수 규칙</b><span>1~4단계 문항·카드 1개당 3점</span><span>1단계 15점 · 2단계 30점 · 3단계 15점 · 4단계 15점 · 5단계 25점(단답 9점 + 서술형 16점)</span><span>서술형은 키워드로 가채점하고 선생님이 최종 확인해요</span><span>만점 100점</span><span>단계마다 채점하고, 마지막에 최종 점수를 선생님께 보내요</span></div>
  <div class="row-end">${S.msg ? `<span class="alert grow" role="alert">${esc(S.msg)}</span>` : ''}<button class="btn" data-act="begin" style="font-size:17px">퀴즈 시작 →</button></div>`;
}

function vHeader(v, sizes, sum) {
  const tiles = PS.map((p) => `<div class="tile"><small>${p + 1}단계</small><b>${S.graded[p] ? score(v, p) : '–'}<span> /${maxOf(v, p)}</span></b></div>`).join('') + `<div class="tile dark"><small>합계</small><b>${sum}<span> /100</span></b></div>`;
  return `<header><div style="flex:1 1 420px;min-width:0"><div class="kick">중학교 정보 · 컴퓨팅 시스템 · 운영체제</div><h1 class="disp">컴퓨터는 어떻게 일할까?</h1><p class="lead"><b style="color:var(--ink)">${esc(S.school + ' ' + S.sid + ' ' + S.name)} · ${v.name} ${v.theme}</b> · 아래 단계 버튼을 눌러 어느 단계로든 옮겨 갈 수 있어요.</p></div><div class="tiles">${tiles}</div></header>`;
}

function vSteps(v, sizes, labels, all) {
  return `<nav class="steps" aria-label="활동 단계">${labels.concat(['최종 제출']).map((l, i) => {
    const st = i < NP ? (S.graded[i] ? '채점 완료' : cnt(i) + '/' + sizes[i]) : (S.sent === 'ok' ? '제출 완료' : all ? '제출 가능' : '');
    return `<button class="step ${S.part === i ? 'on' : ''}" data-act="part" data-p="${i}" aria-current="${S.part === i ? 'step' : 'false'}"><span class="num">${i + 1}</span><span>${l}</span><span class="st">${st}</span></button>`;
  }).join('')}</nav>`;
}

function vOne(v, offs) {
  const P = S.part, list = qs(v, P), g = S.graded[P];
  const title = P === 0 ? '1. 하드웨어일까, 소프트웨어일까?' : P === 2 ? '3. 스마트폰 속 컴퓨터 부품' : '4. ' + v.theme + '에서 배우는 컴퓨터 동작 원리';
  const desc = P === 0 ? '눈에 보이고 만질 수 있는 기계 장치는 하드웨어, 컴퓨터에게 할 일을 알려 주는 프로그램은 소프트웨어예요.' : P === 2 ? '스마트폰 부품이 컴퓨터의 어떤 장치와 같은 역할을 하는지 골라 보세요.' : '가게에서 일어나는 일을 컴퓨터의 동작과 연결해 보세요.';
  const cards = list.map((q, i) => {
    const ch = S.ans[P][i], good = g && ch === q.a;
    const opts = q.o.map((t, oi) => {
      const on = ch === oi; let cls = '', m = '';
      if (!g) cls = on ? 'on' : '';
      else if (oi === q.a) { cls = 'right'; m = on ? '✓ 내 답 · 정답' : '✓ 정답'; }
      else if (on) { cls = 'wrong'; m = '✗ 내 답'; }
      else cls = 'dim';
      return `<button class="opt ${cls}" data-act="pick" data-i="${i}" data-o="${oi}" aria-pressed="${on}" ${g ? 'aria-disabled="true"' : ''}><span class="d">${MARKS[oi]}</span><span>${t}</span><span class="m">${m}</span></button>`;
    }).join('');
    return `<article class="qcard ${g ? (good ? 'ok' : 'bad') : ''}" id="q-${P}-${i}"><div class="qtop"><span class="pill">${offs[P] + i + 1}번</span>${g ? (good ? '<b style="color:var(--ok)">✓ 정답 +3</b>' : '<b style="color:var(--bad)">✗ 다시 보기</b>') : ''}</div>
    ${q.s ? `<div class="scene"><b>상황</b> · ${q.s}</div>` : ''}${q.term ? `<div class="term">${q.term}</div>` : ''}<p class="qq">${q.q}</p><div class="opts ${P === 0 ? 'two' : ''}">${opts}</div>
    ${g ? `<p class="why"><b>정답: ${q.o[q.a]}</b> · ${q.w}</p>` : ''}</article>`;
  }).join('');
  return `<section style="display:flex;flex-direction:column;gap:18px"><div><h2 class="disp">${title}</h2><p class="lead" style="font-size:15px;margin-top:4px">${desc}</p></div><div class="qlist ${P === 0 ? 'p1' : ''}">${cards}</div></section>`;
}

function vP2(v, offs) {
  const g = S.graded[1], hot = !g && (S.sel >= 0 || dragI >= 0);
  const num = (i) => offs[1] + DATA.order.indexOf(i) + 1;
  const pool = DATA.order.filter((i) => S.ans[1][i] === undefined);
  const bins = DATA.cats.map((c) => {
    const items = DATA.order.filter((i) => S.ans[1][i] === c.id).map((i) => {
      let m = '', col = '', bd = '';
      if (g) { if (v.p2[i].a === c.id) { m = '✓ +3'; col = 'var(--ok)'; bd = 'var(--ok)'; } else { m = '✗ 정답: ' + cat(v.p2[i].a).label; col = 'var(--bad)'; bd = 'var(--bad)'; } }
      return `<button class="item ${S.sel === i ? 'sel' : ''}" ${g ? '' : 'draggable="true"'} data-act="unplace" data-i="${i}" style="${bd ? 'border-color:' + bd + ';cursor:default' : ''}" aria-label="${v.p2[i].t}${g ? '' : ' 카드 빼기'}"><span>${num(i)}. ${v.p2[i].t}</span><span class="m" style="color:${col}">${m}</span></button>`;
    }).join('');
    return `<div class="bin ${hot ? 'hot' : ''}" data-drop="${c.id}" style="background:${c.tint};border-color:${c.color}"><div><div class="bl" style="color:${c.color}">${c.label}</div><div class="bh">${c.hint}</div></div><div style="display:flex;flex-direction:column;gap:8px">${items}${g ? '' : `<button class="place" data-act="place" data-c="${c.id}" style="border-color:${c.color};color:${c.color}">${S.sel >= 0 ? '여기에 「' + v.p2[S.sel].t + '」 놓기' : '여기로 끌어 오세요'}</button>`}</div></div>`;
  }).join('');
  const wrong = g ? DATA.order.filter((i) => !ok(v, 1, i)).map((i) => { const c = cat(v.p2[i].a); return `<p class="wline"><b style="color:var(--bad)">${num(i)}번 ${v.p2[i].t}</b> → 정답은 <b>${c.label} 장치</b> · ${v.p2[i].w || c.hint + '.'}</p>`; }).join('') : '';
  return `<section style="display:flex;flex-direction:column;gap:18px"><div class="pool ${hot ? 'hot' : ''}" data-drop="" id="p2top"><div class="navhead"><h2 class="disp" style="font-size:26px">2. 이 장치는 어느 칸일까?</h2><span style="font-size:14px;color:var(--muted)">남은 카드 ${pool.length}장 · 끌기가 어려우면 카드를 한 번 누르고 칸의 ‘여기에 놓기’를 누르세요</span></div>
  <div class="chips">${pool.map((i) => `<button class="chip ${S.sel === i ? 'sel' : ''}" ${g ? '' : 'draggable="true"'} data-act="chip" data-i="${i}" aria-pressed="${S.sel === i}"><span class="cn">${num(i)}</span>${v.p2[i].t}</button>`).join('')}${pool.length ? '' : '<span style="font-size:15px;color:var(--muted);align-self:center">카드를 모두 분류했어요. 아래에서 채점해 보세요.</span>'}</div></div>
  <div class="bins">${bins}</div>${wrong ? `<div style="display:flex;flex-direction:column;gap:8px">${wrong}</div>` : ''}</section>`;
}

function gradeBarHtml(v, sizes) {
  const P = S.part, c = cnt(P), sz = sizes[P], g = S.graded[P], sc = score(v, P), mx = maxOf(v, P);
  let h = '';
  if (g) h += `<span class="grow">${P + 1}단계 ${P === 4 ? '가채점 ' : ''}${sc} / ${mx}점${P === 4 ? ' — 서술형은 선생님이 답안을 읽고 최종 점수를 정해요.' : sc < mx ? ' — 빨간 테두리 문제의 정답과 설명을 확인해 보세요.' : ' — 모두 맞혔어요!'}</span><button class="btn" data-act="part" data-p="${P + 1}">${P < NP - 1 ? (P + 2) + '단계로 →' : '최종 제출로 →'}</button>`;
  else if (c < sz) h += `<button class="btn" disabled>${P === 1 ? (sz - c) + '장 더 놓으면 채점할 수 있어요' : P === 4 ? (sz - c) + '문제 더 쓰면 채점할 수 있어요 (서술형은 10자 이상)' : (sz - c) + '문제 더 풀면 채점할 수 있어요'}</button>`;
  else h += `<button class="btn" data-act="grade">${P + 1}단계 채점하기</button>`;
  return h;
}
function vGradeBar(v, sizes) { return `<div class="row-end" id="gbar">${gradeBarHtml(v, sizes)}</div>`; }

function vP5(v, offs) {
  const x = p5Of(v), ns = x.short.length, g = S.graded[4];
  const shorts = x.short.map((q, i) => {
    const val = S.ans[4][i] || '', good = g && shortOk(q, val);
    return `<article class="qcard ${g ? (good ? 'ok' : 'bad') : ''}" id="q-4-${i}"><div class="qtop"><span class="pill">${offs[4] + i + 1}번 · 단답형</span>${g ? (good ? '<b style="color:var(--ok)">✓ 정답 +3</b>' : '<b style="color:var(--bad)">✗ 다시 보기</b>') : ''}</div>
    <label class="qq" for="p5-${i}">${q.q}</label><input class="t" id="p5-${i}" data-p5="${i}" autocomplete="off" maxlength="30" placeholder="낱말로 답을 쓰세요" value="${esc(val)}" ${g ? 'readonly' : ''} style="max-width:420px${g ? ';background:#F6F8F7' : ''}">
    ${g ? `<p class="why"><b>정답: ${q.ans}</b> · ${q.w}</p>` : ''}</article>`;
  }).join('');

    const rub = e.rubric.map((c, k) => { const hit = r.hits[k]; return `<span style="${g ? (hit ? 'color:var(--ok);font-weight:700' : 'color:var(--muted)') : ''}">${g ? (hit ? '✓' : '–') : '·'} ${c.d} (${g ? (hit ? c.pts : 0) + '/' : ''}${c.pts}점)</span>`; }).join('');
    return `<article class="qcard ${cls}" id="q-4-${i}"><div class="qtop"><span class="pill">${offs[4] + i + 1}번 · 서술형 8점</span>${g ? `<b style="color:${r.score === r.max ? 'var(--ok)' : r.score > 0 ? '#8A3D08' : 'var(--bad)'}">가채점 ${r.score} / ${r.max}점</b>` : ''}</div>
    ${e.s ? `<div class="scene"><b>상황</b> · ${e.s}</div>` : ''}<label class="qq" for="p5-${i}">${e.q}</label>

  }).join('');
  return `<section style="display:flex;flex-direction:column;gap:18px"><div><h2 class="disp">5. 운영체제의 자원 관리</h2><p class="lead" style="font-size:15px;margin-top:4px">운영체제는 CPU·메모리·저장 장치·입출력 장치 같은 자원을 여러 프로그램이 나눠 쓰도록 관리해요. 단답형은 낱말로, 서술형은 문장으로 써 보세요.</p></div>
  <div class="rule"><b>5단계 채점</b><span>단답형 3문항 × 3점</span><span>서술형 2문항 × 8점 (채점 기준별 부분 점수)</span><span>서술형은 키워드로 가채점한 점수예요. 선생님이 답안을 읽고 최종 점수를 정해요.</span></div>
  <h3 style="margin:4px 0 0;font-size:18px">단답형</h3><div class="qlist">${shorts}</div><h3 style="margin:4px 0 0;font-size:18px">서술형</h3><div class="qlist">${essays}</div></section>`;
}

const HARD = ['하드웨어·소프트웨어 구분', '입력·처리·출력·저장·통신 분류', '스마트폰 속 부품', '주기억·보조기억장치', '운영체제의 자원 관리', 'CPU 스케줄링·프로세스'];
function reviewHtml(v, offs) {
  const out = [];
  PS.forEach((p) => { if (!S.graded[p]) return;
    for (let k = 0; k < size(v, p); k++) {
      const i = p === 1 ? DATA.order[k] : k; if (ok(v, p, i)) continue;
      let q, a, w;
      if (p === 1) { const it = v.p2[i]; q = it.t + ' 은(는) 어느 장치일까요?'; a = cat(it.a).label + ' 장치'; w = it.w || cat(it.a).hint + '.'; }
      else if (p === 4) { const x = p5Of(v), ns = x.short.length; if (i < ns) { q = x.short[i].q; a = x.short[i].ans; w = x.short[i].w; } else { const e = x.essay[i - ns]; q = (e.s ? e.s + ' ' : '') + e.q; a = '예시 답안'; w = e.model; } }
      else { const o = qs(v, p)[i]; q = (o.term ? o.term + ' · ' : '') + (o.s ? o.s + ' ' : '') + o.q; a = o.o[o.a]; w = o.w; }
      out.push(`<p class="wline"><b>${offs[p] + k + 1}번</b> ${q}<br><b style="color:var(--ok)">정답: ${a}</b> · ${w}</p>`);
    } });
  return out.length ? `<details class="panel" open><summary style="cursor:pointer;font-weight:700;font-size:16px">복습 노트 · 틀린 문제 해설 모아보기 (${out.length}문제)</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">${out.join('')}</div></details>` : '';
}
function selfHtml() {
  const dis = S.sent === 'ok' || S.sent === 'sending';
  return `<div class="panel" style="display:flex;flex-direction:column;gap:12px"><b style="font-size:16px">오늘 수업 돌아보기 <span style="font-weight:400;font-size:14px;color:var(--muted)">(선택 · 점수와 함께 선생님께 가요)</span></b>
  <div class="ng"><span>이해한 정도</span><span style="font-weight:400">1 어려움</span>${[1, 2, 3, 4, 5].map((n) => `<button class="qn ${S.selfU === n ? 'done' : ''}" data-act="rate" data-n="${n}" aria-pressed="${S.selfU === n}" ${dis ? 'disabled' : ''}>${n}</button>`).join('')}<span style="font-weight:400">5 매우 잘 이해</span></div>
  <div class="ng"><span>어려웠던 개념</span>${HARD.map((h, i) => `<button class="btn ${S.selfC.includes(i) ? '' : 'ghost'}" style="min-height:40px;padding:4px 12px;font-size:14px" data-act="hard" data-c="${i}" aria-pressed="${S.selfC.includes(i)}" ${dis ? 'disabled' : ''}>${h}</button>`).join('')}</div>
  <textarea class="essay" id="selfT" rows="2" maxlength="200" placeholder="선생님께 하고 싶은 말이나 궁금한 점 (선택)" ${dis ? 'readonly' : ''}>${esc(S.selfT)}</textarea></div>`;
}
function vFinal(v, sizes, offs, labels, sum, all) {
  const verdict = !all ? '모든 단계를 채점해야 최종 점수를 보낼 수 있어요. 위의 단계 버튼을 눌러 남은 단계를 마무리하세요.' : sum >= 90 ? '아주 잘했어요! 컴퓨터가 입력·처리·출력·저장·통신으로 일하는 방식을 잘 이해하고 있어요.' : sum >= 70 ? '잘했어요. 틀린 문제를 다시 눌러 설명을 읽어 보세요.' : '좋은 출발이에요. 틀린 문제의 설명을 읽고 다른 유형으로 다시 도전해 보세요.';
  const rows = PS.map((p) => { const sc = score(v, p), mx = maxOf(v, p); return `<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;gap:12px;font-size:15px"><b>${p + 1}. ${labels[p]}</b><span style="color:var(--sub)">${S.graded[p] ? (p === 4 ? '가채점 ' : '') + sc + ' / ' + mx + '점' : '아직 채점 전'}</span></div><div class="bar"><i style="width:${S.graded[p] ? Math.round(sc / mx * 100) : 0}%;background:${BAR[p]}"></i></div></div>`; }).join('');
  const wl = [];
  PS.forEach((p) => { if (!S.graded[p]) return; for (let k = 0; k < sizes[p]; k++) { const i = p === 1 ? DATA.order[k] : k; if (ok(v, p, i)) continue; const n = offs[p] + k + 1; wl.push(`<button class="wbtn" data-act="jump" data-p="${p}" data-k="${k}">${n}번 · ${p === 1 ? v.p2[i].t : p === 0 ? v.p1[i].t : p === 4 ? (k < p5Of(v).short.length ? '단답형' : '서술형') : n + '번 문제'}</button>`); } });
  const notYet = PS.filter((p) => !S.graded[p]).map((p) => p + 1);
  let note = { sending: ['보내는 중이에요…', 'var(--sub)'], ok: ['선생님 시트로 최종 점수를 보냈어요. 수고했어요!', 'var(--ok)'], fail: ['보내지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.', 'var(--bad)'] }[S.sent] || (notYet.length ? ['채점하지 않은 단계: ' + notYet.join(', ') + '단계', 'var(--bad)'] : null);
  if (S.retry) note = ['연습 중이에요. 점수는 처음 제출한 점수만 선생님께 기록돼요.', 'var(--sub)'];
  const can = all && !S.retry && S.sent !== 'ok' && S.sent !== 'sending';
  return `<section style="display:flex;flex-direction:column;gap:18px"><div class="banner"><div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:14px;font-weight:700;opacity:.8">${esc(S.school + ' ' + S.sid + ' ' + S.name)} · ${v.name} ${v.theme} · 최종 점수</span><span class="big">${sum}<span> / 100점</span></span></div><p style="margin:0;font-size:16px;line-height:1.6;max-width:520px">${verdict}</p></div>
  <div class="panel" style="padding:20px;display:flex;flex-direction:column;gap:14px">${rows}</div>
  ${wl.length ? `<div class="panel" style="display:flex;flex-direction:column;gap:10px"><b style="font-size:16px">틀린 문제 다시 보기 · 누르면 그 문제로 가요</b><div style="display:flex;flex-wrap:wrap;gap:8px">${wl.join('')}</div></div>` : ''}
  ${reviewHtml(v, offs)}${selfHtml()}
  <div class="row-end">${note ? `<span class="grow" role="status" style="color:${note[1]};font-size:15px;line-height:1.5">${note[0]}</span>` : ''}${S.sent === 'ok' && !S.retry && wl.length ? '<button class="btn ghost" data-act="retry">틀린 문제만 다시 풀기</button>' : ''}<button class="btn ghost" data-act="again">다른 유형 풀기</button><button class="btn" data-act="submit" ${can ? '' : 'disabled'}>${S.sent === 'ok' ? '보내기 완료' : S.sent === 'fail' ? '다시 보내기' : '선생님께 최종 점수 보내기'}</button></div></section>`;
}

function render() {
  const v = ver(), app = document.getElementById('app');
  if (S.screen !== 'quiz' || !v) { app.innerHTML = vStart(); return; }
  const sizes = PS.map((p) => size(v, p));
  const offs = [0]; for (let p = 1; p < NP; p++) offs.push(offs[p - 1] + sizes[p - 1]);
  const labels = [DATA.parts[0], DATA.parts[1], DATA.parts[2], v.theme, DATA.parts[4]];
  const sum = PS.reduce((a, p) => a + (S.graded[p] ? score(v, p) : 0), 0);
  const all = S.graded.every(Boolean);
  let body = '';
  if (S.part === 1) body = vP2(v, offs) + vGradeBar(v, sizes);
  else if (S.part === 4) body = vP5(v, offs) + vGradeBar(v, sizes);
  else if (S.part === NP) body = vFinal(v, sizes, offs, labels, sum, all);
  else body = vOne(v, offs) + vGradeBar(v, sizes);
  app.innerHTML = vHeader(v, sizes, sum) + vSteps(v, sizes, labels, all) + body;
}

async function submit() {
  const v = ver(); if (S.retry) return; if (!v || !S.graded.every(Boolean) || S.sent === 'ok' || S.sent === 'sending') return;
  if (!/^https:\/\/script\.google\.com\//.test(SHEET_URL)) { alert('선생님 설정이 필요해요: HTML 파일의 SHEET_URL에 웹 앱 주소를 넣어 주세요.'); return; }
  const labels = DATA.parts; // 시트 칸 이름이 유형마다 같도록 고정 이름 사용
  const parts = PS.map((p) => ({ label: (p + 1) + '. ' + labels[p] + (p === 4 ? '(가채점)' : ''), score: score(v, p) }));
  const total = parts.reduce((a, p) => a + p.score, 0);
  const max = PS.reduce((a, p) => a + maxOf(v, p), 0);
  // 단답·서술형 답안과 서술형 가채점 점수도 함께 보내요 (교사가 시트에서 확인 후 최종 점수 결정)
  const x = p5Of(v), ns = x.short.length, extra = { '학교': S.school.trim(), version: v.name + ' ' + v.theme };
  x.short.forEach((q, i) => { extra['단답' + (i + 1)] = S.ans[4][i] || ''; });
  x.essay.forEach((e, j) => { extra['서술' + (j + 1)] = S.ans[4][ns + j] || ''; extra['서술' + (j + 1) + '_가채점'] = essayEval(e, S.ans[4][ns + j]).score; });
  let n = 0;
  PS.forEach((p) => { for (let k = 0; k < size(v, p); k++) { n++; const i = p === 1 ? DATA.order[k] : k; let pt;
    if (p === 4) { const ns2 = x.short.length; pt = i < ns2 ? (shortOk(x.short[i], S.ans[4][i]) ? DATA.shortPts : 0) : essayEval(x.essay[i - ns2], S.ans[4][i]).score; }
    else pt = ok(v, p, i) ? DATA.pts[p] : 0;
    extra['문항' + String(n).padStart(2, '0')] = pt; } });
  extra['이해도'] = S.selfU || ''; extra['어려운개념'] = S.selfC.map((i) => HARD[i]).join(', '); extra['한마디'] = S.selfT.trim();
  const payload = { v: 1, quiz: QUIZ_NAME, sid: S.sid, name: S.name, total, max, parts, extra };
  set({ sent: 'sending' });
  try { await fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }); set({ sent: 'ok' }); }
  catch (e) { set({ sent: 'fail' }); }
}

document.addEventListener('input', (e) => {
  if (e.target.id === 'selfT') S.selfT = e.target.value.slice(0, 200);
  if (e.target.id === 'sschool') S.school = e.target.value.slice(0, 20);
  if (e.target.id === 'sid') S.sid = e.target.value.replace(/\s/g, '').slice(0, 10);
  if (e.target.id === 'sname') S.name = e.target.value.slice(0, 20);
  if (e.target.dataset && e.target.dataset.p5 !== undefined && !S.graded[4]) {
    const i = +e.target.dataset.p5, v = ver();
    S.ans[4][i] = e.target.value;
    const c = document.getElementById('cnt-' + i); if (c) c.textContent = e.target.value.trim().length + '자 · 10자 이상 써야 채점할 수 있어요';
    const gb = document.getElementById('gbar'); if (gb) gb.innerHTML = gradeBarHtml(v, PS.map((p) => size(v, p)));
  }
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, v = ver(), P = S.part;
  if (a === 'ver') set({ ver: b.dataset.v, msg: '' });
  else if (a === 'random') set({ ver: DATA.versions[Math.floor(Math.random() * DATA.versions.length)].id, msg: '' });
  else if (a === 'begin') {
    if (!S.school.trim() || !S.sid || !S.name.trim()) return set({ msg: '학교, 학번, 이름을 모두 입력하세요.' });
    if (!v) return set({ msg: '풀 유형을 하나 고르세요.' });
    set(Object.assign({ screen: 'quiz', msg: '' }, fresh()), true);
  }
  else if (a === 'part') set({ part: +b.dataset.p, sel: -1 }, true);
  else if (a === 'jump') {
    const p = +b.dataset.p, k = +b.dataset.k;
    set({ part: p, sel: -1 });
    const el = document.getElementById(p === 1 ? 'p2top' : 'q-' + p + '-' + k);
    if (el) el.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
  }
  else if (a === 'pick') { if (!S.graded[P]) { const y = window.scrollY; setAns(P, +b.dataset.i, +b.dataset.o); window.scrollTo(0, y); } }
  else if (a === 'grade') { S.graded[P] = true; set({ sel: -1 }); }
  else if (a === 'chip') { const i = +b.dataset.i; set({ sel: S.sel === i ? -1 : i }); }
  else if (a === 'place') { if (S.sel >= 0) setAns(1, S.sel, b.dataset.c); }
  else if (a === 'unplace') { if (!S.graded[1]) setAns(1, +b.dataset.i, null); }
  else if (a === 'rate') { const y = window.scrollY; set({ selfU: +b.dataset.n }); window.scrollTo(0, y); }
  else if (a === 'hard') { const y = window.scrollY, c = +b.dataset.c, l = S.selfC.slice(), k = l.indexOf(c); if (k < 0) l.push(c); else l.splice(k, 1); set({ selfC: l }); window.scrollTo(0, y); }
  else if (a === 'retry') {
    let first = -1;
    PS.forEach((p) => { let any = false; for (let k = 0; k < size(v, p); k++) { const i = p === 1 ? DATA.order[k] : k; if (!ok(v, p, i)) { delete S.ans[p][i]; any = true; } } if (any) { S.graded[p] = false; if (first < 0) first = p; } });
    set({ retry: true, part: first < 0 ? 0 : first, sel: -1 }, true);
  }
  else if (a === 'submit') submit();
  else if (a === 'again') {
    if (S.sent !== 'ok' && S.graded.every(Boolean) && !confirm('아직 점수를 보내지 않았어요. 그래도 처음으로 돌아갈까요?')) return;
    set(Object.assign({ screen: 'start', ver: '', msg: '' }, fresh()), true);
  }
});
document.addEventListener('dragstart', (e) => {
  const c = e.target.closest && e.target.closest('.chip,.item'); if (!c || S.graded[1]) return;
  dragI = +c.dataset.i; try { e.dataTransfer.setData('text/plain', String(dragI)); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
});
document.addEventListener('dragend', () => { dragI = -1; });
document.addEventListener('dragover', (e) => { if (e.target.closest && e.target.closest('[data-drop]')) e.preventDefault(); });
document.addEventListener('drop', (e) => {
  const z = e.target.closest && e.target.closest('[data-drop]'); if (!z || S.graded[1]) return;
  e.preventDefault();
  let i = dragI; if (i < 0) { const t = parseInt(e.dataTransfer.getData('text/plain'), 10); i = isNaN(t) ? -1 : t; }
  if (i >= 0) setAns(1, i, z.dataset.drop || null);
});
render();
</script>
</body>
</html>
